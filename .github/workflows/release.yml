name: Release (EAS build + store submit)

# Runs only when started by hand from the Actions tab.
# Needs the EXPO_TOKEN repository secret; store credentials live in EAS (see docs/DEPLOYMENT.md).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: EAS build profile
        type: choice
        options: [production, preview]
        default: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck && npm test -- --ci
      - name: Build (and submit to the stores for production)
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            eas build --platform ${{ inputs.platform }} --profile production --non-interactive --no-wait --auto-submit
          else
            eas build --platform ${{ inputs.platform }} --profile preview --non-interactive --no-wait
          fi
